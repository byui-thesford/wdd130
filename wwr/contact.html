<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Pioneer Waters</title>
    <meta name="description" content="For all inquiries about the services Pioneer Waters can offer, please use the contact form below.">
    <meta name="author" content="Tristan Joel Hesford">
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <header>
        <img src="images/pioneer-waters-logo-circle.png" alt="Pioneer Waters Logo">
        <nav>
            <ul class="navigation">
                <li><a href="index.html" target="_blank">Home</a></li>
                <li><a href="about.html" target="_blank">About Us</a></li>
                <li><a href="trips.html" target="_blank">Trips</a></li>
                <li><a href="contact.html" target="_blank">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main class="contact">
        <div class="address">
            <h1>Pioneer Waters</h1>
            <p>23 Main River Street</p>
            <p>Council Bluffs, IA 51501</p>            
            <p>+1 555 666 7777</p>
            <p>info@pioneerwaters.com</p>
        </div>
        <div class="map-form">
            <div class="map">
                <!-- <iframe
                src="https://www.google.com/maps/embed?pb=!1m17!1m12!1m3!1d33921.67774625436!2d-95.8912575517199!3d41.2809820688016!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m2!1m1!2zNDHCsDE3JzAzLjciTiA5NcKwNTInMzAuMSJX!5e0!3m2!1sen!2suk!4v1785509304805!5m2!1sen!2suk"
                width="410" height="400" allowfullscreen="" loading="lazy"
                referrerpolicy="strict-origin-when-cross-origin"></iframe> -->
            </div>
            <form>
                <div class="form-group1 column1 form-margin">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required placeholder="Enter your name here">
                    <label for="email">Email</label>
                    <input type="text" id="email" name="email" required placeholder="yourname@email.com">
                </div>
                <div class="radio-row form-margin">
                    <label class="labels column1">Message <br>Purpose</label>                    
                    <div class="radio-group">
                        <label><input type="radio" id="general-inquiry" name="purpose" value="general-inquiry" checked>General Inquiry</label>
                        <label><input type="radio" id="reservation-question" name="purpose" value="reservation-question">Reservation Question</label>
                        <label><input type="radio" id="website-suggestion" name="purpose" value="website-suggestion">Website Suggestion</label>
                    </div>                   
                </div>
                <div class="message form-margin">
                    <label class="labels column1" for="message">Message</label>
                    <textarea id="message" name="message"></textarea>
                </div>
                <div class="column1 form-margin">
                    <label><input type="checkbox" id="subscribe" name="subscribe">Please subscribe me to the monthly newsletter</label>                    
                </div>
                <div class="button-container">
                    <button class="button-contact" type="submit">Get In Touch!</button>
                </div>
            </form>
        </div>
        <section class="employees">
            <h2 class="contact-h2">We Are Here To Serve You</h2>
            <figure>
                <img src="images/employee-1.jpg" alt="Pioneer Waters Employee: Ben Davidson">
                <figcaption>Ben Davidson</figcaption>
            </figure>
            <figure>
                <img src="images/employee-2.jpg" alt="Pioneer Waters Employee: Karen Fisher">
                <figcaption>Karen Fisher</figcaption>
            </figure>
            <figure>
                <img src="images/employee-3.jpg" alt="Pioneer Waters Employee: Brian Harrison">
                <figcaption>Brian Harrison</figcaption>
            </figure>

        </section>
    </main>
    <footer>
        <p>&copy;2026 Pioneer Waters &#127754; Tristan Joel Hesford &#127754;</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com" target="_blank">
                <img src="images/linkedin.svg" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com" target="_blank">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>    
</body>
</html>
